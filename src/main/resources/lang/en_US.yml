# ============================================================
# ===============  OTHER (PREFIXES, COLORS, ETC.) ============
# ============================================================

special-tags:
  # ---------------- PREFIXES ----------------
  prefix:
    crates: "<gradient:#FF8C00:#FFD700>ᴄʀᴀᴛᴇꜱ</gradient>"

  # ---------------- COLORS ----------------
  ncolor:
    primary: "#FF8C00"
    secondary: "#FFD700"
    success: "#7AF291"
    error: "#F27474"
    default: "#B0AEC1"

  # ---------------- OTHER ----------------
  other:
    separator: "<#B0AEC1>»</#B0AEC1>"

# ============================================================
# ======================== FEATURES ==========================
# ============================================================

command:
  reload:
    start: "<prefix:crates> <separator> <ncolor:default>Reloading NiveriaCrates...</ncolor>"
    done: "<prefix:crates> <separator> <ncolor:success>NiveriaCrates has been reloaded. (<time_ms> ms)</ncolor>"
    error: "<prefix:crates> <separator> <ncolor:error>An error occurred while reloading NiveriaCrates. Please check the console for more information.</ncolor>"

menu:
  editor:
    title: "<ncolor:primary><bold>ᴍᴇɴᴜ</bold> | ɴɪᴠᴇʀɪᴀᴄʀᴀᴛᴇѕ ᴇᴅɪᴛᴏʀ</ncolor>"

    crates:
      name: "<ncolor:primary>Crates</ncolor>"
      lore: |-
        <separator> <ncolor:primary>ᴄʟɪᴄᴋ</ncolor> <ncolor:secondary>ᴛᴏ ᴏᴘᴇɴ ᴛʜᴇ ᴄʀᴀᴛᴇѕ ᴇᴅɪᴛᴏʀ</ncolor>

    keys_editor:
      name: "<ncolor:primary>Keys</ncolor>"
      lore: |-
        <separator> <ncolor:primary>ᴄʟɪᴄᴋ</ncolor> <ncolor:secondary>ᴛᴏ ᴏᴘᴇɴ ᴛʜᴇ ᴋᴇʏѕ ᴇᴅɪᴛᴏʀ</ncolor>

  crates:
    title: "<ncolor:primary><bold>ᴍᴇɴᴜ</bold> | ᴄʀᴀᴛᴇѕ ᴇᴅɪᴛᴏʀ</ncolor>"

    back:
      name: "<ncolor:primary>Back</ncolor>"
      lore: |-
        <separator> <ncolor:primary>ᴄʟɪᴄᴋ</ncolor> <ncolor:secondary>ᴛᴏ ɢᴏ ᴛᴏ ᴛʜᴇ ᴘʀᴇᴠɪᴏᴜѕ ᴍᴇɴᴜ</ncolor>

    new:
      name: "<ncolor:primary>New Crate</ncolor>"
      lore: |-
        <separator> <ncolor:primary>ᴄʟɪᴄᴋ</ncolor> <ncolor:secondary>ᴛᴏ ᴄʀᴇᴀᴛᴇ ᴀ ɴᴇᴡ ᴄʀᴀᴛᴇ</ncolor>

      title_sent:
        title: "<ncolor:primary>Crate ID</ncolor>"
        subtitle: "<ncolor:secondary>Enter the ID for the new crate</ncolor>"

      invalid_id: "<prefix:crates> <separator> <ncolor:error>The crate ID you entered is invalid.</ncolor>"

    previous_page:
      name: "<ncolor:primary>Previous Page</ncolor>"
      lore: |-
        <separator> <ncolor:primary>ᴄʟɪᴄᴋ</ncolor> <ncolor:secondary>ᴛᴏ ɢᴏ ᴛᴏ ᴛʜᴇ ᴘʀᴇᴠɪᴏᴜѕ ᴘᴀɢᴇ</ncolor>

    next_page:
      name: "<ncolor:primary>Next Page</ncolor>"
      lore: |-
        <separator> <ncolor:primary>ᴄʟɪᴄᴋ</ncolor> <ncolor:secondary>ᴛᴏ ɢᴏ ᴛᴏ ᴛʜᴇ ɴᴇxᴛ ᴘᴀɢᴇ</ncolor>

  edit_crate:
    title: "<ncolor:primary><bold>ᴍᴇɴᴜ</bold> | ᴇᴅɪᴛ ᴄʀᴀᴛᴇ: <ncolor:secondary><crate_id></ncolor></ncolor>"

    rename:
      name: "<ncolor:primary>Rename Crate</ncolor>"
      lore: |-
        <ncolor:secondary>ᴄᴜʀʀᴇɴᴛ ɴᴀᴍᴇ</ncolor> <white><crate_name></white>

        <separator> <ncolor:primary>ᴄʟɪᴄᴋ</ncolor> <ncolor:secondary>ᴛᴏ ʀᴇɴᴀᴍᴇ ᴛʜɪѕ ᴄʀᴀᴛᴇ</ncolor>

      title_sent:
        title: "<ncolor:primary>Crate Name</ncolor>"
        subtitle: "<ncolor:secondary>Enter the name for the new crate</ncolor>"

    icon:
      name: "<ncolor:primary>Change Icon</ncolor>"
      lore: |-
        <separator> <ncolor:primary>ᴅʀᴀɢ ᴀɴᴅ ᴅʀᴏᴘ</ncolor> <ncolor:secondary>ᴀɴ ɪᴛᴇᴍ ᴏɴ ᴛʜɪѕ ʙᴜᴛᴛᴏɴ ᴛᴏ ᴄʜᴀɴɢᴇ ᴛʜᴇ ɪᴄᴏɴ</ncolor>

      invalid_item: "<prefix:crates> <separator> <ncolor:error>The item you dropped is invalid.</ncolor>"

    back:
      name: "<ncolor:primary>Back</ncolor>"
      lore: |-
        <separator> <ncolor:primary>ᴄʟɪᴄᴋ</ncolor> <ncolor:secondary>ᴛᴏ ɢᴏ ᴛᴏ ᴛʜᴇ ᴘʀᴇᴠɪᴏᴜѕ ᴍᴇɴᴜ</ncolor>

    delete:
      name: "<ncolor:error>Delete Crate</ncolor>"
      lore: |-
        <separator> <red><key:key.drop></red> <ncolor:error>ᴛᴏ ᴅᴇʟᴇᴛᴇ ᴛʜɪѕ ᴄʀᴀᴛᴇ</ncolor>

    delete_confirm:
      name: "<red>Are you sure to delete this crate ?</red>"
      lore: |-
        <separator> <red><key:key.drop></red> <ncolor:error>ᴛᴏ ᴘᴇʀᴍᴀɴᴇɴᴛʟʏ ᴅᴇʟᴇᴛᴇ ᴛʜɪѕ ᴄʀᴀᴛᴇ</ncolor>

update:
  available: |-
    <prefix:crates> <separator> <ncolor:default>There is a new version of <ncolor:primary>NiveriaCrates</ncolor>: <ncolor:error><current_version></ncolor> → <ncolor:success><latest_version></ncolor></ncolor>
    <ncolor:default>Download link: <ncolor:secondary><click:open_url:"https://modrinth.com/plugin/niveriacrates">https://modrinth.com/plugin/niveriacrates</click></ncolor></ncolor>
